name: Runtime Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build, test and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Enable corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Setup pnpm (action)
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run tests with coverage
        run: pnpm test:cov

      - name: Check coverage threshold (lines >= 75)
        # Read coverage summary produced by jest and show coverage stats
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const p = 'coverage/coverage-summary.json';
          const fullPath = path.resolve(p);

          console.log('🔍 Checking for coverage file...');
          console.log('Working directory:', process.cwd());
          console.log('Looking for file:', fullPath);
          console.log('File exists:', fs.existsSync(p));

          if (!fs.existsSync(p)) {
            console.error('❌ Coverage summary not found at ' + p);
            console.error('Full path:', fullPath);
            console.error('Current directory contents:');
            try {
              fs.readdirSync('.').forEach(f => console.error('  ' + f));
              if (fs.existsSync('coverage')) {
                console.error('Coverage directory contents:');
                fs.readdirSync('coverage').forEach(f => console.error('  coverage/' + f));
              }
            } catch (e) {
              console.error('Error reading directory:', e.message);
            }
            process.exit(2);
          }

          let c;
          try {
            c = JSON.parse(fs.readFileSync(p, 'utf8'));
          } catch (e) {
            console.error('❌ Error reading coverage file:', e.message);
            process.exit(3);
          }

          const lines = c.total.lines.pct;
          const statements = c.total.statements.pct;
          const functions = c.total.functions.pct;
          const branches = c.total.branches.pct;

          console.log('📊 Coverage Report:');
          console.log('  Lines:     ' + lines.toFixed(2) + '%');
          console.log('  Statements:' + statements.toFixed(2) + '%');
          console.log('  Functions: ' + functions.toFixed(2) + '%');
          console.log('  Branches:  ' + branches.toFixed(2) + '%');

          const threshold = 75;
          if (lines < threshold) {
            console.error('❌ Coverage below threshold: ' + lines.toFixed(2) + '% < ' + threshold + '%');
            console.error('💡 Please add more tests to improve coverage');
            process.exit(1);
          }

          console.log('✅ Coverage meets threshold: ' + lines.toFixed(2) + '% >= ' + threshold + '%');
          "
